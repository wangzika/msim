<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>msim · 实时物理试验</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1420;color:#d5e4f1;font:16px system-ui}main{max-width:1500px;margin:auto;padding:25px}h1{margin:0;font-size:28px}.muted{color:#9db7cd;line-height:1.7}.bar,.panel{background:#122335;border:1px solid #304a60;border-radius:12px;padding:18px;margin-top:18px}.bar{display:flex;gap:25px;flex-wrap:wrap;align-items:center}button{background:#21405b;color:#e6f2ff;border:1px solid #517a96;border-radius:6px;padding:10px 14px;cursor:pointer}canvas{display:block;width:100%;height:580px;touch-action:none;background:#09131f;border-radius:8px}#status{color:#6fe1d1}label{cursor:pointer}#numbers{white-space:pre-wrap;line-height:1.8}.warning{color:#ffc780}a{color:#7ee4f4}</style>
<main><h1>msim · 实时物理试验 <span id="status">正在连接</span></h1>
<p class="muted">Bullet 六自由度刚体、真实碰撞与分时激光扫描。参考控制器用于验证物理后端；此入口尚未运行 PX4 或 FAST-LIO。完整飞控与建图请使用 Gazebo 兼容后端。</p>
<div class="bar"><b id="clock">仿真时间 —</b><span id="phase">—</span><span id="speed">—</span><button id="reset">适应视野</button><button id="top">俯视</button><button id="export">导出 PNG</button><a id="download" hidden>下载 PNG</a><label><input id="showCloud" type="checkbox" checked> 测距点</label><label><input id="showScene" type="checkbox" checked> 碰撞轮廓</label></div>
<section class="panel"><canvas id="view" aria-label="实时三维物理场景"></canvas><p class="muted">拖动旋转 · 滚轮缩放 · 白：真实轨迹 · 蓝：GPS · 紫：目标。测距点按各自采样时刻的真实位姿变换，仅用于显示，不是 SLAM 地图。</p><p class="warning" id="collision">等待物理状态</p><p id="numbers"></p></section>
<p class="muted">场景使用原始碰撞几何；网格模型在此预览中显示包围轮廓，物理射线与碰撞仍使用完整三角网格。按 Ctrl+C 停止后保存已有数据。</p></main>
<script>
const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');let state={},scene={objects:[]},yaw=-.65,pitch=.7,zoom=1,drag=null,center=null,span=30;
function fit(){const path=state.trajectory||[];if(!path.length)return;const points=[...path,state.target||path.at(-1)],lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(const p of points)for(let i=0;i<3;i++){lo[i]=Math.min(lo[i],p[i]);hi[i]=Math.max(hi[i],p[i])}center=lo.map((v,i)=>(v+hi[i])/2);span=Math.max(15,...lo.map((v,i)=>hi[i]-v))*1.5;zoom=1}
function draw(){const ratio=Math.min(devicePixelRatio||1,2),w=canvas.clientWidth,h=580;canvas.width=w*ratio;canvas.height=h*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);if(!center)fit();if(!center)return;const scale=Math.min(w,h)*.8/span*zoom;
function project(v){const x=v[0]-center[0],y=v[1]-center[1],z=v[2]-center[2],u=Math.cos(yaw)*x-Math.sin(yaw)*y,a=Math.sin(yaw)*x+Math.cos(yaw)*y;return[w/2+u*scale,h/2+(Math.sin(pitch)*a-Math.cos(pitch)*z)*scale]}
function line(points,color,width=1){if(!points.length)return;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();points.forEach((p,i)=>{const a=project(p);i?ctx.lineTo(...a):ctx.moveTo(...a)});ctx.stroke()}
const ground=Math.floor(center[2]);for(let d=-5;d<=5;d++){const v=d*span/10;line([[center[0]-span/2,center[1]+v,ground],[center[0]+span/2,center[1]+v,ground]],'#1a3347');line([[center[0]+v,center[1]-span/2,ground],[center[0]+v,center[1]+span/2,ground]],'#1a3347')}
for(let i=0;i<3;i++){const v=[...center];v[i]+=span*.18;line([center,v],['#ef8d89','#8cdda1','#83b9f1'][i]);const a=project(v);ctx.fillStyle=['#ef8d89','#8cdda1','#83b9f1'][i];ctx.fillText(['E','N','U'][i],a[0]+5,a[1])}
if($('showScene').checked)for(const item of scene.objects){if(item.kind==='plane')continue;const size=item.size||item.bounds_size||[2*(item.radius||1),2*(item.radius||1),item.length||2*(item.radius||1)],m=item.display_matrix||item.matrix,pts=[];for(let k=0;k<8;k++){const v=size.map((s,i)=>((k>>i)&1?s/2:-s/2));pts.push(v.map((_,i)=>m[i][3]+v.reduce((a,b,j)=>a+m[i][j]*b,0)))}for(let k=0;k<8;k++)for(let j=0;j<3;j++)if(!(k&(1<<j)))line([pts[k],pts[k|(1<<j)]],'#456176')}
if($('showCloud').checked){ctx.fillStyle='#68adc7';for(const p of state.cloud||[]){const a=project(p);ctx.fillRect(a[0],a[1],1.7,1.7)}}
line(state.trajectory||[],'#e9eef4',2.5);line(state.gps_path||[],'#62b4f9',1.5);
for(const [p,color,label] of [[state.position,'#6fe1d1','飞机'],[state.target,'#d5a1ff','目标']])if(p){const a=project(p);ctx.fillStyle=color;ctx.beginPath();ctx.arc(a[0],a[1],5,0,Math.PI*2);ctx.fill();ctx.font='16px system-ui';ctx.fillText(label,a[0]+10,a[1]-8)}
}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(20,Math.max(.05,zoom*Math.exp(-e.deltaY*.001)));draw()},{passive:false});$('reset').onclick=()=>{fit();draw()};$('top').onclick=()=>{pitch=1.57;draw()};$('showCloud').onchange=$('showScene').onchange=draw;$('export').onclick=async()=>{const button=$('export');button.disabled=true;try{const response=await fetch('/api/export/png',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:canvas.toDataURL('image/png')})});if(!response.ok)throw Error('保存失败');const result=await response.json(),a=$('download');a.href=result.url;a.download='msim-physics.png';a.hidden=false;a.textContent='图片已保存，下载 PNG'}catch(e){button.textContent='导出失败，请重试'}finally{button.disabled=false}};new ResizeObserver(draw).observe(canvas);
async function poll(){try{const response=await fetch('/api/state',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);state=await response.json();$('status').textContent=state.phase==='running'?'● 实时运行':state.phase==='completed'?'● 已完成':'● '+state.phase;$('clock').textContent='仿真时间 '+state.sim_time_s.toFixed(1)+' s';$('phase').textContent='参考控制：'+(state.control_source==='gnss'?'GPS 位置反馈':'理想状态反馈');$('speed').textContent='实时倍率 '+(state.real_time_factor||0).toFixed(2)+' ×';$('collision').textContent=state.contacts?'接触数 '+state.contacts:'当前无接触';$('numbers').textContent='真值 E / N / U：'+(state.position||[]).map(x=>x.toFixed(2)).join(' / ')+' m\n速度：'+(state.velocity||[]).map(x=>x.toFixed(2)).join(' / ')+' m/s  |  已完成激光帧：'+(state.lidar_frames||0)+'  |  欺骗位移：'+(state.spoof_offset||[]).map(x=>x.toFixed(2)).join(' / ')+' m';draw()}catch(e){$('status').textContent='连接已断开；保留最后一帧'}setTimeout(poll,100)}
fetch('/api/scene').then(r=>r.json()).then(s=>{scene=s;draw()}).catch(()=>{});poll();
</script></html>
