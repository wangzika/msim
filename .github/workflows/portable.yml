name: Portable replay core
on: [push, pull_request]
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[bag]"
      - run: python -m unittest discover -s tests/portable -v
      - run: python -m msim demo --output build/portable-demo
      - run: python -m msim replay --input build/portable-demo --output build/portable-result
      - name: Core has no ROS or rendering runtime imports
        run: python -c "import msim.replay, sys; assert not (set(sys.modules) & {'rospy','rosbag','rclpy','scipy','matplotlib'})"
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install --only-binary=:all: pybullet==3.2.7
      - run: python -m pip install ".[bag,physics]"
      - run: python -m unittest discover -s tests/portable -v
      - run: python -m msim simulate --backend bullet --world scenes/simple.world --output build/physics-ci --duration-s 2 --real-time-factor 0
