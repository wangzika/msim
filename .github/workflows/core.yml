name: FAST_GLIO SignalSim geometry
on: [push, pull_request]
jobs:
  geometry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cmake -S . -B build/core -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/core
      - run: ctest --test-dir build/core --output-on-failure
      - name: Install Python test dependencies
        run: |
          python3 -m venv build/ci-python
          build/ci-python/bin/python -m pip install -r tests/fastglio/requirements.txt
      - run: build/ci-python/bin/python -m unittest discover -s tests/fastglio -p 'test_*.py'
      - run: build/ci-python/bin/python tests/fastglio/test_rtklib_runner.py tools/rtklib/rtklib_runner.py
