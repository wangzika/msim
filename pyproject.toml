[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msim-portable"
version = "0.2.0"
description = "Portable replay, experimental physical sensors and full-stack compatibility for msim"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
bag = ["rosbags>=0.11,<0.12"]
physics = ["pybullet==3.2.7"]

[project.scripts]
msim = "msim.cli:main"

[tool.setuptools]
packages = ["msim"]

[tool.setuptools.package-data]
msim = ["data/*.json", "data/*.html"]
